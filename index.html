<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بسته آیکون فارسی | SVG</title>
<style>
:root{--bg:#111;--fg:#fff;--accent:#ffd700}
body.light{--bg:#fff;--fg:#111}
body{font-family:Vazirmatn,sans-serif;background:var(--bg);color:var(--fg);margin:0;text-align:center}
.icons{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;margin:40px 0;font-size:3rem}
.price{font-size:2.5rem;color:var(--accent);margin:20px}
.btn{background:var(--accent);color:#000;padding:16px 40px;border-radius:8px;text-decoration:none;font-weight:bold}
</style>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn&display=swap" rel="stylesheet">
</head>
<body>
<button style="position:absolute;top:20px;left:20px" onclick="document.body.classList.toggle('light')">تم</button>
<h1 style="padding-top:80px">۲۰۰+ آیکون SVG فارسی</h1>
<p>مناسب اپ، وب و برندینگ. کاملاً وکتور و قابل تغییر.</p>
<div class="icons">🏠 💼 📈 📧 📅 💡</div>
<div class="price">۳۴۹٬۰۰۰ تومان</div>
<a href="#" class="btn">خرید و دانلود فوری</a>
<p style="margin:40px;opacity:.7">شامل فایل SVG، PNG و فنت وب.</p>
</body>
</html>
